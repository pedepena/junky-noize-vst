name: Compilar Junky Noize

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: JunkyNoize-Windows
          - name: macOS
            os: macos-latest
            artifact: JunkyNoize-macOS
          - name: Linux
            os: ubuntu-latest
            artifact: JunkyNoize-Linux

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar librerias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Configurar
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Crear instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { '0.1.0' }
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $isccPath = if ($isccCommand) { $isccCommand.Source } else { 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $isccPath)) { throw 'Inno Setup 6 (ISCC.exe) is not available on this runner.' }
          & $isccPath /DPluginVersion=$version packaging/windows/JunkyNoize.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Empaquetar macOS o Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then version="0.1.0"; fi
          bash packaging/package-unix.sh "$RUNNER_OS" "$version"

      - name: Subir instalador de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packaging/windows/Output/*.exe
          if-no-files-found: error

      - name: Subir paquete macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/package/*.zip
          if-no-files-found: error

      - name: Subir paquete Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/package/*.tar.gz
          if-no-files-found: error

  release:
    name: Publicar archivos de GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar instaladores y paquetes
        uses: actions/download-artifact@v4
        with:
          pattern: JunkyNoize-*
          path: release-assets
          merge-multiple: true
      - name: Adjuntar archivos a la version
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
