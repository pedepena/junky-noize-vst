name: Compilar Junky Noize

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      todas_las_plataformas:
        description: "Compilar también para macOS y Linux"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os == 'windows-latest' && 'Windows' || matrix.os == 'macos-latest' && 'macOS' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.todas_las_plataformas) && fromJSON('["windows-latest","ubuntu-latest","macos-latest"]') || fromJSON('["windows-latest"]') }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Cache de fuentes JUCE
        uses: actions/cache@v4
        with:
          path: .cache/FetchContent/juce-src
          key: cmake-juce-source-${{ runner.os }}-juce-8.0.8

      - name: Instalar librerias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Configurar
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DFETCHCONTENT_BASE_DIR="$PWD/.cache/FetchContent"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_BASE_DIR="$PWD/.cache/FetchContent"
          fi

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Instalar Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Convertir banner y crear instalador
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $png = [System.Drawing.Image]::FromFile((Join-Path $PWD 'installer/installer_banner.png'))
          try { $png.Save((Join-Path $PWD 'installer/installer_banner.bmp'), [System.Drawing.Imaging.ImageFormat]::Bmp) }
          finally { $png.Dispose() }

          $cmakeText = Get-Content CMakeLists.txt -Raw
          if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $version = $Matches[1] }
          elseif ($cmakeText -match 'project\(JunkyNoize VERSION ([^)\s]+)') { $version = $Matches[1] }
          else { $version = '1.0.0' }
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $isccPath = if ($isccCommand) { $isccCommand.Source } else { 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $isccPath)) { throw 'Inno Setup 6 (ISCC.exe) is not available on this runner.' }
          & $isccPath "/DPluginVersion=$version" installer/JunkyNoize.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Empaquetar macOS o Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then version="0.1.0"; fi
          bash packaging/package-unix.sh "$RUNNER_OS" "$version"

      - name: Subir paquete Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-latest' && 'JunkyNoize-Windows' || matrix.os == 'macos-latest' && 'JunkyNoize-macOS' || 'JunkyNoize-Linux' }}
          path: installer/Output/*.exe
          if-no-files-found: error

      - name: Subir instalador de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: JunkyNoize-Instalador
          path: installer/Output/*.exe
          if-no-files-found: error

      - name: Subir paquete macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-latest' && 'JunkyNoize-Windows' || matrix.os == 'macos-latest' && 'JunkyNoize-macOS' || 'JunkyNoize-Linux' }}
          path: build/package/*.zip
          if-no-files-found: error

      - name: Subir paquete Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-latest' && 'JunkyNoize-Windows' || matrix.os == 'macos-latest' && 'JunkyNoize-macOS' || 'JunkyNoize-Linux' }}
          path: build/package/*.tar.gz
          if-no-files-found: error

  release:
    name: Publicar archivos de GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar instaladores y paquetes
        uses: actions/download-artifact@v4
        with:
          pattern: JunkyNoize-*
          path: release-assets
          merge-multiple: true
      - name: Adjuntar archivos a la version
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
